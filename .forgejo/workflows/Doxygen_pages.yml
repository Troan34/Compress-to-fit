name: Doxygen to Codeberg Pages

on:
  push:
    branches:
      - main # Triggered when code is pushed to the main branch
    paths:
      - "Compress-to-fit/**"      # Modify according to your source code path
      - "Doxyfile"    # Triggered when Doxyfile changes
  workflow_dispatch: {} # Allow manual triggering

jobs:
  publish:
    runs-on: codeberg-small
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Build Doxygen HTML
        run: |
          doxygen Doxyfile
          #Ensure index.html was created
          test -f documentation/html/index.html || (echo "Doxygen failed!" && exit 1)

      #Use actions to deploy pages
      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/Compress-to-fit/
          token: ${{ forge.token }}
          source: 'documentation/html/'